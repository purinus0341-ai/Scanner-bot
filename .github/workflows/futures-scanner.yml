name: Crypto futures scanner (signals only)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose test Telegram or scan live public candles (no trading)"
        type: choice
        options:
          - test_telegram
          - scan
        default: test_telegram
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: write
concurrency:
  group: futures-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r futures_scanner/requirements.txt
      - run: python -m pytest futures_scanner/tests -q
      - name: Check Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::Missing TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::Missing TELEGRAM_CHAT_ID"; exit 1; }
      - name: Send test Telegram message
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test_telegram'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m futures_scanner.test_telegram
      - name: Scan read-only market data
        if: github.event_name == 'schedule' || inputs.mode == 'scan'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m futures_scanner.main
      - name: Persist alert dedup state
        if: github.event_name == 'schedule' || inputs.mode == 'scan'
        run: |
          if ! git diff --quiet -- futures_scanner/state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add futures_scanner/state.json
            git commit -m 'chore: record futures alerts'
            git pull --rebase
            git push
          fi
